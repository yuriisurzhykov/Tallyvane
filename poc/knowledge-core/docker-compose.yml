# Postgres with pgvector, and Ollama for the embeddings. The application itself runs with ./gradlew run.
#
# Values come from the .env file next to this one (see .env.example); every one has a default.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: knowledge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge"]
      interval: 3s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 3s
      timeout: 5s
      retries: 20

  # Downloads the embedding model once, then exits. The model is kept in the ollama-data volume.
  ollama-pull:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${EMBED_MODEL:-nomic-embed-text}"]
    restart: "no"

volumes:
  postgres-data:
  ollama-data:
