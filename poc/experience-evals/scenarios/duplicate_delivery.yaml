version: 1
id: duplicate_delivery
description: Redelivering the same message does not call the model or add another revision.
tags:
- idempotency
initial_state: ../fixtures/two-companies.yaml
context:
  company_id: c1
  project_id: p1
  task_id: t1
  action_id: a1
turns:
- input:
    id: duplicate_delivery_m1
    text: Ещё использовал Room.
  expected:
    changes:
    - operation: add_technologies
      action_id: a1
      technologies:
      - Room
      evidence:
        message_id: duplicate_delivery_m1
        quote: Ещё использовал Room.
    unresolved_references: []
- input:
    id: duplicate_delivery_m1
    text: Ещё использовал Room.
  expected:
    changes:
    - operation: add_technologies
      action_id: a1
      technologies:
      - Room
      evidence:
        message_id: duplicate_delivery_m1
        quote: Ещё использовал Room.
    unresolved_references: []
