name: Publish Backend Image

on:
  push:
    branches: [ master ]
    tags: [ 'backend-v*' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# `packages: write` is what lets the run's own GITHUB_TOKEN publish to ghcr.io. No
# separate secret exists for this, and none is needed.
permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build Backend and publish
    runs-on: ubuntu-latest
    # Written in full and in lower case rather than derived from github.repository:
    # that variable is `yuriisurzhykov/Tallyvane`, and ghcr.io rejects a capital letter
    # in an image name.
    env:
      IMAGE: ghcr.io/yuriisurzhykov/tallyvane-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make the wrapper executable
        run: chmod +x ./gradlew
        working-directory: backend

      # The Dockerfile compiles nothing; it copies what these two tasks produce.
      - name: Build the distributions
        run: ./gradlew :app:installDist :migrate:installDist --no-daemon
        working-directory: backend

      - name: Build the image
        run: docker build -t "$IMAGE:${{ github.sha }}" backend

      # Every push builds, which is what catches a broken Dockerfile. Only a tag
      # publishes, so the registry holds versions somebody meant to deploy.
      - name: Log in to the registry
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Publish under the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:${{ github.ref_name }}"
          docker push "$IMAGE:${{ github.ref_name }}"