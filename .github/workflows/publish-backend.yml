name: Publish Backend Image

on:
  push:
    branches: [ master ]
    tags: [ 'backend-v*' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# `packages: write` is what lets the run's own GITHUB_TOKEN publish to ghcr.io. No
# separate secret exists for this, and none is needed. `security-events: write` is what lets
# the scan step below upload its SARIF to the Security tab.
permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  image:
    name: Build Backend and publish
    runs-on: ubuntu-latest
    # Written in full and in lower case rather than derived from github.repository:
    # that variable is `yuriisurzhykov/Tallyvane`, and ghcr.io rejects a capital letter
    # in an image name.
    env:
      IMAGE: ghcr.io/yuriisurzhykov/tallyvane-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make the wrapper executable
        run: chmod +x ./gradlew
        working-directory: backend

      # The Dockerfile compiles nothing; it copies what these two tasks produce.
      - name: Build the distributions
        run: ./gradlew :app:installDist :migrate:installDist --no-daemon
        working-directory: backend

      - name: Build the image
        run: docker build -t "$IMAGE:${{ github.sha }}" backend

      # Only on a tag, same as the publish steps below: scanning is cheap, but there is no
      # sense spending the time on a commit that is never going to be published anyway.
      - name: Scan for vulnerabilities
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ./.github/actions/scan-image
        with:
          image-ref: "${{ env.IMAGE }}:${{ github.sha }}"

      # Every push builds, which is what catches a broken Dockerfile. Only a tag
      # publishes, so the registry holds versions somebody meant to deploy.
      - name: Log in to the registry
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Publish under the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:${{ github.ref_name }}"
          docker push "$IMAGE:${{ github.ref_name }}"

  deploy:
    name: Deploy app
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # Sparse: this job needs the composite action's own files and nothing else the
      # repository holds.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions/deploy-service
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/deploy-service
        with:
          service-name: app
          image-ref: ghcr.io/yuriisurzhykov/tallyvane-backend:${{ github.ref_name }}
          ssh-host: ${{ secrets.TALLYVANE_DEPLOY_HOST }}
          ssh-known-hosts: ${{ secrets.TALLYVANE_SSH_KNOWN_HOSTS }}
          ssh-key: ${{ secrets.TALLYVANE_DEPLOY_KEY }}