name: Publish Frontend Admin Image

on:
  push:
    branches: [ master ]
    tags: [ 'frontend-admin-v*' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build frontend-admin and publish
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/yuriisurzhykov/tallyvane-frontend-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # See publish-frontend-web.yml's identical comment: no "Prepare workspace" step,
      # same reasoning, same independent-tag consequence of ADR-065.
      - name: Build the image
        run: docker build -f frontend-admin/Dockerfile -t "$IMAGE:${{ github.sha }}" .

      - name: Log in to the registry
        if: startsWith(github.ref, 'refs/tags/frontend-admin-v')
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Publish under the tag
        if: startsWith(github.ref, 'refs/tags/frontend-admin-v')
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:${{ github.ref_name }}"
          docker push "$IMAGE:${{ github.ref_name }}"
