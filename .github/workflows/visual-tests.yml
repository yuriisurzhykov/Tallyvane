name: Visual & Accessibility Tests

# Screenshots, axe and APCA contrast, on every pull request and every push to
# the default branch. Both events run in compare-only mode — never
# `--update-snapshots` here.
#
# The reason that matters: a workflow that regenerates baselines when they fail
# can never fail. It would rewrite the expectation to match whatever the code
# now produces and report success, which is the one outcome a regression suite
# must not be able to reach. Baselines are accepted deliberately instead, from
# the pull request, through the `/update-snapshots <module>` command in
# accept-visual-baselines.yml — so by the time a branch merges its baselines are
# already right, and this run on the default branch is a confirmation rather
# than a place that writes back to the repository.
#
# One job per workspace member with its own suite, run as a matrix rather than
# a single job hardcoded to one directory — see
# docs/frontend/02-component-testing-architecture.md for why the checking
# logic itself (packages/test-kit) does not belong to any one of them.
# `frontend-admin` joins this matrix the same way once it has a visual suite
# of its own; nothing else here changes.

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ master ]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: visual-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Browser suites (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      # One module's failure should not hide whether the other passed —
      # they check unrelated things (an app's own pages versus every Tier 0
      # component in isolation).
      fail-fast: false
      matrix:
        include:
          - module: frontend-web
            name: frontend-web
          - module: packages/storybook
            name: storybook
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare-workspace
      - uses: ./.github/actions/setup-playwright
        with:
          module: ${{ matrix.module }}

      # Playwright builds and starts the app itself, through the `webServer`
      # entry in its config, so there is no separate build step to keep in step
      # with it. For `packages/storybook`, `test:e2e` ensures the static
      # Storybook output first (`ensure-storybook-static.mjs`; CI always
      # rebuilds because the folder is gitignored and not cached) and only
      # then runs Playwright against it — see that package's own
      # `playwright.config.ts` for why the build cannot happen inside
      # `webServer` here.
      - name: Run suites
        working-directory: ${{ matrix.module }}
        run: pnpm run test:e2e

      # `!cancelled()` rather than `always()`: a run someone stopped on purpose
      # has nothing worth uploading, and `always()` would also fire after a
      # cancellation and slow it down.
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.name }}
          # The report carries the diff images beside their baselines, which is
          # the only form in which a visual failure is legible at all.
          path: |
            ${{ matrix.module }}/playwright-report
            ${{ matrix.module }}/test-results
          retention-days: 14

      - name: Build the pull-request comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: >
          node .github/scripts/format-summary.mjs
          ${{ matrix.module }}/test-results/summary.json
          "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ${{ matrix.module }}/pr-comment.md

      # A distinct `header` per module, so `frontend-web`'s and `storybook`'s
      # comments are two separate sticky comments rather than one overwriting
      # the other — the same reasoning that keeps the WCAG and APCA suites in
      # separate files: each failure should name which question it answers.
      - name: Comment on the pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: ${{ matrix.name }}
          path: ${{ matrix.module }}/pr-comment.md
