name: Publish Frontend Web Image

on:
  push:
    tags: [ 'frontend-web-v*' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# `packages: write` is what lets the run's own GITHUB_TOKEN publish to ghcr.io. No
# separate secret exists for this, and none is needed. `security-events: write` is what lets
# the scan step below upload its SARIF to the Security tab.
permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  image:
    name: Build frontend-web and publish
    runs-on: ubuntu-latest
    # Written in full and in lower case rather than derived from github.repository —
    # same reasoning as publish-backend.yml.
    env:
      IMAGE: ghcr.io/yuriisurzhykov/tallyvane-frontend-web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No "Prepare workspace" step here, unlike frontend-backend-tests.yml: the
      # Dockerfile's own builder stage runs `pnpm install --frozen-lockfile` inside the
      # image, against the exact same committed lockfile. Installing a second copy on the
      # runner first would only be spent time nothing downstream reads — `docker build`
      # never sees the runner's own `node_modules`.
      #
      # Tagged by commit SHA on every push (catches a broken Dockerfile immediately);
      # only a `frontend-web-v*` tag additionally logs in and publishes, independently of
      # the backend's and the other two frontends' own tags (ADR-065's release
      # consequence) — a change to one never forces a rebuild of the others.
      - name: Build the image
        run: docker build -f frontend-web/Dockerfile -t "$IMAGE:${{ github.sha }}" .

      # Only on a tag, same as the publish steps below: scanning is cheap, but there is no
      # sense spending the time on a commit that is never going to be published anyway.
      - name: Scan for vulnerabilities
        if: startsWith(github.ref, 'refs/tags/frontend-web-v')
        uses: ./.github/actions/scan-image
        with:
          image-ref: "${{ env.IMAGE }}:${{ github.sha }}"

      - name: Log in to the registry
        if: startsWith(github.ref, 'refs/tags/frontend-web-v')
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Publish under the tag
        if: startsWith(github.ref, 'refs/tags/frontend-web-v')
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:${{ github.ref_name }}"
          docker push "$IMAGE:${{ github.ref_name }}"

  deploy:
    name: Deploy frontend-web
    needs: image
    if: startsWith(github.ref, 'refs/tags/frontend-web-v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions/deploy-service
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/deploy-service
        with:
          service-name: frontend-web
          image-ref: ghcr.io/yuriisurzhykov/tallyvane-frontend-web:${{ github.ref_name }}
          ssh-host: ${{ secrets.TALLYVANE_DEPLOY_HOST }}
          ssh-known-hosts: ${{ secrets.TALLYVANE_SSH_KNOWN_HOSTS }}
          ssh-key: ${{ secrets.TALLYVANE_DEPLOY_KEY }}
