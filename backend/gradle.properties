# Build performance. Small modules make incremental compilation fast, but only
# if the build itself is allowed to cache and parallelise.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# The daemon runs alongside Postgres and Node on a 2 GB VPS during deploys, so
# it is capped rather than left to grow. Local development is unaffected.
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

kotlin.code.style=official
