# Authoritative manifest of who may depend on whom.
#
# The Gradle graph is checked against this file by the `validateModuleGraph`
# task. Any deviation fails the build — an undeclared dependency and a declared
# but unused one are both errors. The point is that gaining access to another
# module is a visible line in a diff, not a quiet import.
#
# See ARCHITECTURE.md section 15.2.

layers:
  contract:       [platform:kernel, platform:events, any:contract]
  domain:         [platform:kernel]
  application:    [own:domain, own:contract, platform:kernel, platform:events, any:contract]
  infrastructure: [own:application, own:contract, "platform:*"]
  # kernel and idempotency: tests only. A route is tested behind the real edge, which asks a ledger,
  # so a spec needs the fakes of both, as platform:health's does.
  web:            [own:application, own:contract, platform:http, platform:kernel, platform:idempotency]

platform:
  kernel:        { depends: [] }
  events:        { depends: [platform:kernel] }
  # observability: persistence supplies the health checks over its own access to the
  # database, so it needs the HealthCheck port. The edge runs this way and not the
  # other because a check about Postgres belongs where Postgres is known.
  # idempotency: the transactions it hands out take the request's claim first, so persistence
  # implements the ledger and the claims over its own database.
  persistence:   { depends: [platform:kernel, platform:observability, platform:idempotency] }
  # observability: the response renderer puts the request's trace id on every answer and
  # logs one line per failure, so it needs TraceContext. Same shape as persistence's edge.
  # idempotency: the edge reads Idempotency-Key, fingerprints the request and asks the ledger
  # what is already known about it.
  http:          { depends: [platform:kernel, platform:observability, platform:idempotency] }
  # The vocabulary of "this request was already seen" and the two ports that answer it. Owns no
  # storage and no HTTP: persistence implements the ports, http speaks the header.
  idempotency:   { depends: [platform:kernel] }
  outbox:        { depends: [platform:kernel, platform:persistence] }
  llm:           { depends: [platform:kernel] }
  storage:       { depends: [platform:kernel] }
  exec:          { depends: [platform:kernel] }
  observability: { depends: [platform:kernel] }
  # The only platform module that publishes endpoints. It needs the reporter it exposes
  # (observability) and the machinery to expose it with (http); nothing depends on it but
  # `app`, so the edges stay one-directional.
  # idempotency: tests only. The edge it is mounted on asks a ledger, and the spec uses the fake.
  health:        { depends: [platform:kernel, platform:observability, platform:http, platform:idempotency] }

# Modules that exist in the build today.
modules:
  # Who the person is (ADR-076). No `web` yet: nothing about an account is served on its own until
  # the settings screen; registration is a step of signing in and is served by `authentication`. Its
  # `web` serves `GET /me`, the one question about an account the application asks of its signed-in person.
  identity:
    layers: [contract, domain, application, infrastructure, web]
    reads: []
    publishes: [AccountDeleted]
  authentication:
    layers: [contract, domain, application, infrastructure, web]
    # Finds the account a Google sign-in proved, and creates it at registration (ADR-076).
    reads: [identity]
    publishes: []

  # What a person was given once they proved who they are (ADR-076, ADR-079). It redeems a completed
  # sign-in through the contract of `authentication` and names the account by `identity`'s `AccountId`.
  sessions:
    layers: [domain, application, infrastructure, web]
    reads: [authentication, identity]
    publishes: []

# Modules that are designed but not yet created. Listed here so the intended
# shape is reviewable before any code exists, and so `reads` conflicts surface
# on paper rather than after the fact. Moving an entry from `planned` to
# `modules` is what makes it real.
planned:
  # Authentication is three modules, one per question (ADR-076): who the person is,
  # how they proved it, what they were given. Reads run one way only.
  jobs:
    layers: [contract, domain, application, infrastructure, web]
    reads: [identity]
    publishes: [JobSaved, JobUpdated]
  capture:
    layers: [contract, application, infrastructure, web]
    reads: [jobs, identity]
    publishes: []
  applications:
    layers: [contract, domain, application, infrastructure, web]
    reads: [jobs, documents, identity]
    publishes: [ApplicationSubmitted, StatusAdvanced, InterviewScheduled]
  contacts:
    layers: [contract, domain, application, infrastructure, web]
    reads: [jobs, identity]
    publishes: [ConnectionSent, MessageLogged]
  documents:
    layers: [contract, domain, application, infrastructure, web]
    reads: [identity]
    publishes: []
  resume:
    layers: [contract, domain, application, infrastructure, web]
    reads: [jobs, documents]
    publishes: [ResumeRendered]
  compensation:
    layers: [contract, domain, application, infrastructure, web]
    reads: [identity]
    publishes: []
  briefing:
    layers: [domain, application, infrastructure, web]
    reads: [jobs, applications, contacts, documents, compensation]
    publishes: []
  reminders:
    layers: [contract, domain, application, infrastructure, web]
    reads: [applications, contacts]
    publishes: []
    subscribes: ["*"]
  analytics:
    layers: [application, infrastructure, web]
    reads: []
    publishes: []
    subscribes: ["*"]
  content:
    layers: [contract, domain, application, infrastructure, web]
    reads: [identity]
    publishes: [ContentPublished]
  mailbox:
    layers: [domain, application, infrastructure, web]
    reads: [applications, contacts]
    publishes: [MessageLogged]
