[versions]
# Build & language
kotlin = "2.4.10"

# Static analysis
detekt = "2.0.0-alpha.6"
ktlint = "14.2.0"

# Testing
kotest = "6.2.4"
konsist = "0.17.3"

# YAML
snakeyaml = "2.4"

[libraries]
# Gradle.
# Plugin JARs on the build-logic classpath so convention plugins can
# import plugin types. Modules apply them by id(), not these aliases.
gradle-kotlin-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
gradle-detekt-plugin = { group = "dev.detekt", name = "dev.detekt.gradle.plugin", version.ref = "detekt" }
gradle-ktlint-plugin = { group = "org.jlleitschuh.gradle.ktlint", name = "org.jlleitschuh.gradle.ktlint.gradle.plugin", version.ref = "ktlint" }

# Kotest
kotest-runner-junit5 = { group = "io.kotest", name = "kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { group = "io.kotest", name = "kotest-assertions-core", version.ref = "kotest" }

# Konsist
konsist = { group = "com.lemonappdev", name = "konsist", version.ref = "konsist" }

# SnakeYAML
snakeyaml = { group = "org.yaml", name = "snakeyaml", version.ref = "snakeyaml" }

[plugins]
# Kotlin
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }

# Detekt
detekt = { id = "dev.detekt", version.ref = "detekt" }

# ktlint
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
