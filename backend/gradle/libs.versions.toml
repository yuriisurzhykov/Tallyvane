[versions]
# Build & language
kotlin = "2.4.10"
coroutines = "1.11.0"
serialization = "1.11.0"

# Static analysis
detekt = "2.0.0-alpha.6"
ktlint = "14.2.0"
# Engine the Gradle plugin runs. Plugin 14.2.0 defaults to 1.5.0; pin it
# so the custom ruleset compiles against the same API the worker loads.
ktlintEngine = "1.5.0"

# Testing
kotest = "6.2.4"
konsist = "0.17.3"

# YAML
snakeyaml = "2.4"

# Logging
slf4j = "2.0.18"
logback = "1.6.3"

[libraries]
# Gradle.
# Plugin JARs on the build-logic classpath so convention plugins can
# import plugin types. Modules apply them by id(), not these aliases.
gradle-kotlin-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
gradle-detekt-plugin = { group = "dev.detekt", name = "dev.detekt.gradle.plugin", version.ref = "detekt" }
gradle-ktlint-plugin = { group = "org.jlleitschuh.gradle.ktlint", name = "org.jlleitschuh.gradle.ktlint.gradle.plugin", version.ref = "ktlint" }

# Kotlinx
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# Kotest
kotest-runner-junit5 = { group = "io.kotest", name = "kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { group = "io.kotest", name = "kotest-assertions-core", version.ref = "kotest" }

# Konsist
konsist = { group = "com.lemonappdev", name = "konsist", version.ref = "konsist" }

# ktlint engine (the linter, not the Gradle plugin)
ktlint-cli-ruleset-core = { group = "com.pinterest.ktlint", name = "ktlint-cli-ruleset-core", version.ref = "ktlintEngine" }
ktlint-rule-engine-core = { group = "com.pinterest.ktlint", name = "ktlint-rule-engine-core", version.ref = "ktlintEngine" }
ktlint-test = { group = "com.pinterest.ktlint", name = "ktlint-test", version.ref = "ktlintEngine" }

# SnakeYAML
snakeyaml = { group = "org.yaml", name = "snakeyaml", version.ref = "snakeyaml" }

# slf4j.
# -api:  the facade modules compile against.
# -nop:  binding that discards everything (test classpaths that must stay quiet).
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
slf4j-nop = { group = "org.slf4j", name = "slf4j-nop", version.ref = "slf4j" }

# Logback
logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }

[plugins]
# Kotlin
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }

# Detekt
detekt = { id = "dev.detekt", version.ref = "detekt" }

# ktlint
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
