# Added only by docker-compose.local.yml, next to the templated server blocks of ../nginx/templates.
# Two hosts: `localhost` is the console and `127.0.0.1` is the administrators' site. The backend tells its
# two doors apart by host (ADR-097) and Google accepts a plain-http redirect URI only on localhost or a
# loopback address, so the second door is the loopback address; cookies are per host, so the two sessions
# do not meet.
#
# Google refuses `app.localhost` as a redirect URI and accepts plain `localhost`, so on a laptop the
# console and the API share one host, exactly as they share `app.<DOMAIN>` in production: `/api/`
# to the server, everything else to the console. The upstreams are the ones 00-common.conf.template
# defines, so a colour switch changes this block too.
server {
    listen 80;
    server_name localhost;

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host:8080;
    }

    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host:8080;
        proxy_set_header X-Forwarded-Host $host:8080;
    }
}

# The administrators' site (frontend-admin), at http://127.0.0.1:8080. Cloudflare Access is not here.
server {
    listen 80;
    server_name 127.0.0.1;

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host:8080;
    }

    location / {
        proxy_pass http://frontend_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host:8080;
        proxy_set_header X-Forwarded-Host $host:8080;
    }
}
