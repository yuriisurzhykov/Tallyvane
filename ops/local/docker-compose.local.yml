# What differs on a laptop, and only that. Used on top of ../docker-compose.yml, which is the very
# file the server runs: same services, same networks, same nginx templates, same health checks.
# Start it through ./stand.sh. Relative paths here resolve against ops/ (the first file), not this directory.
#
#   - the server, the console and the administrators' site are built from this checkout instead of pulled from the registry;
#   - nginx publishes port 8080 and gets one extra server block for `localhost`;
#   - nothing here touches the services' own settings: those come from ./.env, same names as on the
#     server, other values.
services:
  nginx:
    ports:
      - "8080:80"
    volumes:
      - ./local/nginx-localhost.conf:/etc/nginx/conf.d/99-localhost.conf:ro

  server-blue:
    build:
      context: ../backend
  # Same image as server-blue. Without a build of its own, compose tries to pull it from a registry
  # (where `tallyvane-server:local` does not exist) before server-blue has built it.
  migrate:
    build:
      context: ../backend
  frontend-app-blue:
    build:
      context: ..
      dockerfile: frontend-app/Dockerfile

  frontend-admin-blue:
    build:
      context: ..
      dockerfile: frontend-admin/Dockerfile

  # On a laptop the marketing site is never reached (only `localhost`, the console and the API, and
  # `127.0.0.1`, the administrators' site, are routed). nginx still needs its name to exist before it
  # starts, so it runs as an idle placeholder instead of one more full Next.js build (a complete pnpm install).
  frontend-web-blue:
    image: nginx:alpine
    healthcheck:
      disable: true
