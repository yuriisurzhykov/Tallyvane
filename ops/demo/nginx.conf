server {
    listen 80;
    server_name app.localhost localhost;
    access_log off;
    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { proxy_pass http://frontend-app:3000; proxy_set_header Host $host; }
}
server {
    listen 80;
    server_name admin.localhost;
    access_log off;
    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { proxy_pass http://frontend-admin:3000; proxy_set_header Host $host; }
}
server {
    listen 80;
    server_name surzhykov.localhost web.localhost;
    access_log off;
    location / { proxy_pass http://frontend-web:3000; proxy_set_header Host $host; }
}
server {
    listen 80;
    server_name mail.localhost;
    access_log off;
    location / {
        proxy_pass http://mailpit:8025;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
server {
    listen 81;
    server_name localhost;
    access_log off;
    location /api/ { proxy_pass http://server:8080; proxy_set_header Host $host; }
    location / { proxy_pass http://frontend-admin:3000; proxy_set_header Host $host; }
}
