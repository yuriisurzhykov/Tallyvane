# The edge, the database and the three Next.js frontends for a single VPS.
#
# Values are written here rather than in a `.env` this file would interpolate. A committed
# `.env` is forbidden in this repository, and not as a formality: it is the file people reach
# for when they have an API key to park somewhere, and one lapse of memory publishes it. So
# anything secret appears here only as a `${VAR}` reference with no default, resolved from the
# deploy's own environment, and everything non-secret is written in the open where a reviewer
# reads it in the diff.
#
# The project name is pinned because compose otherwise derives it from the directory name,
# which is `ops` in a clone and `tallyvane` on the server.
name: tallyvane

# 50 MB per file, five files, per container. The host's Docker daemon is configured with the
# same numbers, and this repeats them on purpose: `/etc/docker/daemon.json` is not in this
# repository, so a rebuilt machine would come up with no bound at all and nothing would say
# so. `logging` governs stdout and stderr only — which is why every service here logs there
# rather than to a file of its own.
x-log-bound: &log-bound
  driver: json-file
  options:
    max-size: 50m
    max-file: "5"

# Groups app and all three frontends under one Grafana Cloud project view (ADR-067). One
# anchor, same reasoning as x-log-bound above: four services agreeing on this value is the
# point, so it is written once and referenced, not retyped identically four times.
x-otel-namespace: &otel-namespace service.namespace=tallyvane

# Blue/green (CD plan §2-3): each rollout-eligible service is declared TWICE, once per
# colour, sharing everything but its name. Anchors carry the shared half so a colour pair
# cannot drift into two specs that quietly disagree with each other over time.
#
# `profiles` keeps a bare `docker compose up -d` (typed by hand, without going through
# apply.sh) from starting either colour at all — nginx measurably refuses to (re)load once
# any upstream it declares names a container that is not running (ops/README.md,
# 2026-08-28), so which colour is "the one actually running" must always be a deliberate
# choice apply.sh makes by naming it explicitly, never an accident of a bare `up`.
x-app: &app-defaults
  image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
  restart: unless-stopped
  profiles: [ blue-green ]
  environment:
    TALLYVANE_DB_URL: jdbc:postgresql://db:5432/tallyvane
    TALLYVANE_DB_USER: tallyvane
    TALLYVANE_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    TALLYVANE_HEALTH_TOKEN: ${TALLYVANE_HEALTH_TOKEN:?TALLYVANE_HEALTH_TOKEN must be set}
    TALLYVANE_LOG_LEVEL: ${TALLYVANE_LOG_LEVEL:-INFO}
    # -javaagent alongside -XX:MaxRAMPercentage in the same value, same reasoning as the
    # heap/mem_limit pairing this line already carries: two settings that only make sense read
    # together stay written together, not one here and one guessed at from a second file.
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=66 -javaagent:/opt/tallyvane/opentelemetry-javaagent.jar
    OTEL_SERVICE_NAME: tallyvane-app
    OTEL_RESOURCE_ATTRIBUTES: *otel-namespace
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?OTEL_EXPORTER_OTLP_ENDPOINT must be set}
    OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:?OTEL_EXPORTER_OTLP_HEADERS must be set}
    # ADR-067: renames the agent's own Logback MDC keys so they stop overwriting TraceContext's
    # trace_id/span_id (ADR-056) instead of coexisting with them.
    OTEL_INSTRUMENTATION_COMMON_LOGGING_TRACE_ID_KEY: otel_trace_id
    OTEL_INSTRUMENTATION_COMMON_LOGGING_SPAN_ID_KEY: otel_span_id
  mem_limit: 576m
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  networks: [ edge, data ]
  logging: *log-bound
  healthcheck:
    test: [ "CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8080/api/v1/health/live" ]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 20s

x-frontend-web: &frontend-web-defaults
  image: ${FRONTEND_WEB_IMAGE:?FRONTEND_WEB_IMAGE must be set}
  restart: unless-stopped
  profiles: [ blue-green ]
  # @vercel/otel (frontend-shared's registerTallyvaneOtel, called from each app's own
  # instrumentation.ts) reads these three exactly as written — the same OTLP endpoint and
  # token the backend agent uses (ADR-067), one Grafana Cloud project for all four services.
  environment:
    OTEL_SERVICE_NAME: tallyvane-frontend-web
    OTEL_RESOURCE_ATTRIBUTES: *otel-namespace
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?OTEL_EXPORTER_OTLP_ENDPOINT must be set}
    OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:?OTEL_EXPORTER_OTLP_HEADERS must be set}
  mem_limit: 256m
  networks: [ edge ]
  logging: *log-bound
  healthcheck:
    test: [ "CMD", "wget", "--quiet", "--tries=1", "--output-document=/dev/null", "http://127.0.0.1:3000/" ]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 10s

x-frontend-app: &frontend-app-defaults
  image: ${FRONTEND_APP_IMAGE:?FRONTEND_APP_IMAGE must be set}
  restart: unless-stopped
  profiles: [ blue-green ]
  environment:
    OTEL_SERVICE_NAME: tallyvane-frontend-app
    OTEL_RESOURCE_ATTRIBUTES: *otel-namespace
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?OTEL_EXPORTER_OTLP_ENDPOINT must be set}
    OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:?OTEL_EXPORTER_OTLP_HEADERS must be set}
  mem_limit: 384m
  networks: [ edge ]
  logging: *log-bound
  healthcheck:
    test: [ "CMD", "wget", "--quiet", "--tries=1", "--output-document=/dev/null", "http://127.0.0.1:3000/today" ]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 10s

x-frontend-admin: &frontend-admin-defaults
  image: ${FRONTEND_ADMIN_IMAGE:?FRONTEND_ADMIN_IMAGE must be set}
  restart: unless-stopped
  profiles: [ blue-green ]
  environment:
    OTEL_SERVICE_NAME: tallyvane-frontend-admin
    OTEL_RESOURCE_ATTRIBUTES: *otel-namespace
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?OTEL_EXPORTER_OTLP_ENDPOINT must be set}
    OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:?OTEL_EXPORTER_OTLP_HEADERS must be set}
  mem_limit: 192m
  networks: [ edge ]
  logging: *log-bound
  healthcheck:
    test: [ "CMD", "wget", "--quiet", "--tries=1", "--output-document=/dev/null", "http://127.0.0.1:3000/pages" ]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 10s

services:
  # Nothing listens on a port of this machine. cloudflared opens an outbound connection to
  # Cloudflare and receives requests through it, so the firewall can refuse every inbound
  # port except SSH.
  cloudflared:
    image: cloudflare/cloudflared:2026.8.2
    restart: unless-stopped
    # The image's entrypoint is already `cloudflared --no-autoupdate`.
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      # Generated from config.yml.template during deployment, and not committed.
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      # Deliberately outside the tree deploy.sh syncs, so `rsync --delete` can never reach
      # it. The file belongs to uid 65532 and to nobody else — 65532 is the user this image
      # runs as, which is what lets the container keep its own non-root user. Granting the
      # process root inside the container to read one file is the trade this avoids.
      - ${TUNNEL_CREDENTIALS:-/srv/secrets/tallyvane/tunnel-credentials.json}:/etc/cloudflared/credentials.json:ro
    networks: [ edge ]
    # Waiting for healthy, not merely started: the tunnel announces itself to Cloudflare as
    # soon as it connects, and requests arrive immediately. Starting it while nginx is still
    # coming up turns a restart into a short burst of 502s.
    depends_on:
      nginx:
        condition: service_healthy
    logging: *log-bound

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    environment:
      # The image's entrypoint runs envsubst over templates/ and writes the result into
      # conf.d/. The filter confines substitution to this one prefix: without it, envsubst
      # would replace every `${...}` naming any environment variable that happens to exist.
      NGINX_ENVSUBST_FILTER: ^TALLYVANE_
      # `:?` is the only thing standing between a missing domain and a silent misroute, so it
      # must not grow a default. Measured: with the variable absent, envsubst leaves
      # `${TALLYVANE_DOMAIN}` in the file verbatim and nginx accepts it as a perfectly valid
      # server name — every real hostname then falls through to the default server and gets a
      # 404, and `nginx -t` reports success. See the dated entry in ops/README.md.
      TALLYVANE_DOMAIN: ${DOMAIN:?DOMAIN must be set}
      # Blue/green (§2 of the CD plan): PRIMARY carries traffic, SECONDARY is always
      # declared too — marked `down` in 00-common.conf.template — because nginx resolves
      # every declared upstream server at load time whether or not any location sends it
      # traffic (measured, ops/README.md 2026-08-28). In steady state both point at the
      # same, single running container; only apply.sh --rollout ever makes them differ,
      # and only for as long as a rollout is actually in flight.
      TALLYVANE_APP_PRIMARY: app-${APP_ACTIVE_COLOR:-blue}
      TALLYVANE_APP_SECONDARY: app-${APP_ACTIVE_COLOR:-blue}
      TALLYVANE_FRONTEND_WEB_PRIMARY: frontend-web-${FRONTEND_WEB_ACTIVE_COLOR:-blue}
      TALLYVANE_FRONTEND_WEB_SECONDARY: frontend-web-${FRONTEND_WEB_ACTIVE_COLOR:-blue}
      TALLYVANE_FRONTEND_APP_PRIMARY: frontend-app-${FRONTEND_APP_ACTIVE_COLOR:-blue}
      TALLYVANE_FRONTEND_APP_SECONDARY: frontend-app-${FRONTEND_APP_ACTIVE_COLOR:-blue}
      TALLYVANE_FRONTEND_ADMIN_PRIMARY: frontend-admin-${FRONTEND_ADMIN_ACTIVE_COLOR:-blue}
      TALLYVANE_FRONTEND_ADMIN_SECONDARY: frontend-admin-${FRONTEND_ADMIN_ACTIVE_COLOR:-blue}
    volumes:
      # conf.d is deliberately not mounted. The entrypoint writes generated configuration
      # into it, and templates/default.conf.template overwrites the image's own welcome-page
      # server by name; a read-only mount would defeat both.
      - ./nginx/templates:/etc/nginx/templates:ro
    networks: [ edge ]
    logging: *log-bound
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--output-document=/dev/null", "http://127.0.0.1/healthz" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Applies migrations and exits. ADR-051: the deploy migrates, the server never does it at
  # startup — which is what lets the readiness probe verify the schema rather than report on work
  # it just did itself. It reads the same three database variables the server does.
  migrate:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    restart: "no"
    command: [ "java", "-cp", "/opt/tallyvane/migrate/lib/*", "tallyvane.migrate.MigrateKt" ]
    environment:
      TALLYVANE_DB_URL: jdbc:postgresql://db:5432/tallyvane
      TALLYVANE_DB_USER: tallyvane
      # Mapped from the database's own variable rather than repeated in .env: one password, one
      # place, and no way for the two to disagree.
      TALLYVANE_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    depends_on:
      db:
        condition: service_healthy
    networks: [ data ]
    logging: *log-bound

  # Two containers, not one: apply.sh --rollout starts the idle colour beside whichever one
  # is currently primary, cuts nginx over, and only then retires the old one — see §2-3 of
  # the CD plan and the anchors above. §16.2's "JVM 576, heap 384" is JAVA_TOOL_OPTIONS
  # (there) paired with mem_limit (here); measured: 382 MiB against this 576 MB limit,
  # 4.9 GiB against none.
  app-blue:
    <<: *app-defaults
  app-green:
    <<: *app-defaults

  # Three applications, not one shared process (ADR-032 split admin off; ADR-065 split the
  # console off too) — each its own container, its own crash domain, its own `mem_limit`.
  # None talks to Postgres directly: the browser and each app's own server-side content
  # fetch both go through Ktor (ADR-012), never straight to `db`, which is why `edge` is
  # the only network any of the three joins. Each also comes in a blue/green pair for the
  # same reason `app` does — ADR-065's mem_limit estimates are unchanged, only duplicated.
  frontend-web-blue:
    <<: *frontend-web-defaults
  frontend-web-green:
    <<: *frontend-web-defaults

  frontend-app-blue:
    <<: *frontend-app-defaults
  frontend-app-green:
    <<: *frontend-app-defaults

  frontend-admin-blue:
    <<: *frontend-admin-defaults
  frontend-admin-green:
    <<: *frontend-admin-defaults

  db:
    # The one place this tag is written. `PostgresFixture` must run the same image: musl and
    # glibc disagree on text collation, so a different build of the same major version can
    # pass a test the shipped image fails, with no cause a reader would find.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tallyvane
      POSTGRES_USER: tallyvane
      # No default, on purpose: compose refuses to start rather than run on a password
      # somebody committed.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      # Read by init/, which applies them to the role. ADR-061 explains why these exist on
      # top of the bounds PostgresPersistence sets on its own connections.
      POSTGRES_STATEMENT_TIMEOUT: 15s
      POSTGRES_LOCK_TIMEOUT: 3s
      POSTGRES_IDLE_IN_TRANSACTION_TIMEOUT: 60s
    # ARCHITECTURE.md §16.2's memory budget for a 2 GB VPS. Measured defaults in this image,
    # for comparison: shared_buffers 128MB, work_mem 4MB, max_connections 100 — so this
    # profile buys 64 MB of cache and gives back 80 connection slots.
    #
    # max_connections is the one with teeth. A connection is a backend process on the server,
    # and one application pool holds its full size open at rest — eight, measured in
    # backend/playground/pool-occupancy. Two copies during an update is 16 of these 20.
    command:
      - postgres
      - -c
      - shared_buffers=192MB
      - -c
      - work_mem=8MB
      - -c
      - max_connections=20
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, when the data directory is first created.
      - ./init:/docker-entrypoint-initdb.d:ro
    # §16.2 allots PostgreSQL 384 MB, and limits are per service so a spike in one container
    # cannot kill its neighbours. nginx and cloudflared carry no limit yet: the numbers are
    # supposed to come from `docker stats` against these containers, and a guess here would
    # be a limit that kills a working process for no reason.
    mem_limit: 384m
    networks: [ data ]
    logging: *log-bound
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  # cloudflared reaches nginx and nothing else. The subnet is pinned rather than left to
  # Docker because nginx has to name it: behind the tunnel the peer address is a container
  # address, and set_real_ip_from needs the exact range to accept a forwarded client address
  # from it.
  edge:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  # PostgreSQL has no business reaching the internet or being reachable from the tunnel.
  # `internal` removes the network's route out; the server will join both networks, and it
  # will be the only thing that can see the database.
  data:
    internal: true
    ipam:
      config:
        - subnet: 172.28.1.0/24

volumes:
  pgdata:
