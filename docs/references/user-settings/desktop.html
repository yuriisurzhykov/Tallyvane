<div id="tv-settings" aria-label="Прототип настроек Tallyvane">
<style>
#tv-settings{--bg:light-dark(#fff,#191c1b);--side:light-dark(#f5f6f3,#141715);--ink:light-dark(#26362e,#e6ece7);--sub:light-dark(#647269,#a5b2a9);--line:light-dark(#e4e8e2,#343d36);--green:light-dark(#286044,#9fcead);--on:light-dark(#fff,#152a1d);--wash:light-dark(#eaf1e9,#273c2d);font:14px/1.55 system-ui,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:18px;overflow:hidden;position:relative}
#tv-settings *{box-sizing:border-box}#tv-settings button,#tv-settings input,#tv-settings select{font:inherit}#tv-settings button{cursor:pointer}#tv-settings button:disabled{cursor:default;opacity:.55}#tv-settings header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 26px;border-bottom:1px solid var(--line)}#tv-settings .brand{font-weight:650;letter-spacing:-.5px;font-size:19px}#tv-settings .brand span{color:var(--green)}#tv-settings .context{display:flex;gap:10px;align-items:center}#tv-settings select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}#tv-settings .avatar{background:var(--wash);color:var(--green);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px}#tv-settings .layout{display:grid;grid-template-columns:210px 1fr;min-height:610px}#tv-settings aside{padding:30px 16px;background:var(--side)}#tv-settings .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--sub);margin:0 12px 18px}#tv-settings nav{display:grid;gap:5px}#tv-settings nav button{border:0;background:transparent;text-align:left;padding:11px 12px;color:var(--sub);border-radius:9px;display:flex;gap:10px;align-items:center}#tv-settings nav button.active{background:var(--wash);color:var(--green);font-weight:600}#tv-settings main{padding:34px 42px;min-width:0}#tv-settings h1{font-size:28px;letter-spacing:-1px;line-height:1.2;margin:0 0 10px;font-weight:600}#tv-settings h2{font-size:16px;margin:0 0 5px;font-weight:600}#tv-settings p{margin:0;color:var(--sub)}#tv-settings .intro{margin-bottom:32px}#tv-settings .group{margin-top:28px}#tv-settings .row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:19px 0;border-bottom:1px solid var(--line)}#tv-settings .row strong{font-weight:500;display:block;margin-bottom:3px}#tv-settings .row p{font-size:13px;max-width:390px}#tv-settings .badge{display:inline-block;color:var(--green);font-size:12px;background:var(--wash);padding:3px 9px;border-radius:20px;margin-top:8px}#tv-settings .action{border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:9px 14px;white-space:nowrap}#tv-settings .primary{background:var(--green);color:var(--on);border-color:var(--green)}#tv-settings .fields{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}#tv-settings label{display:block;font-size:13px}#tv-settings input:not([type=checkbox]){display:block;width:100%;margin-top:7px;padding:11px 12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px}#tv-settings .footer{display:flex;align-items:center;gap:10px;margin-top:24px;flex-wrap:wrap}#tv-settings .status{color:var(--sub);font-size:12px;flex:1;min-width:130px}#tv-settings .switch{appearance:none;width:40px;height:24px;border:0;border-radius:20px;background:var(--line);position:relative;flex-shrink:0;cursor:pointer}#tv-settings .switch:before{content:'';position:absolute;width:18px;height:18px;top:3px;left:3px;background:var(--bg);border-radius:50%;transition:transform .15s}#tv-settings .switch:checked{background:var(--green)}#tv-settings .switch:checked:before{transform:translateX(16px);background:var(--on)}#tv-settings .toggle-end{display:flex;align-items:center;gap:10px;flex-shrink:0}#tv-settings .micro{font-size:12px;color:var(--sub)}#tv-settings .notice{padding:14px 16px;background:var(--wash);border-radius:10px;color:var(--green);margin-top:24px;font-size:13px}#tv-settings dialog{position:absolute;inset:70px 12px auto;max-width:460px;width:calc(100% - 24px);margin:0 auto;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 16px 70px #0003;z-index:4}#tv-settings dialog::backdrop{background:#0005}#tv-settings dialog h2{font-size:20px;margin-bottom:12px}#tv-settings .step{font-size:12px;color:var(--green);margin-bottom:12px}#tv-settings .demo{font-size:11px;color:var(--sub);padding:10px 26px;border-top:1px solid var(--line)}#tv-settings .error{color:light-dark(#ad3030,#ffa7a7);font-size:13px;margin-top:10px}#tv-settings .mobile-back{display:none}#tv-settings[data-compact=true] .row{padding:12px 0}
@media(max-width:640px){#tv-settings header{padding:16px}#tv-settings .avatar{display:none}#tv-settings .layout{grid-template-columns:1fr;min-height:580px}#tv-settings aside{padding:22px 16px}#tv-settings main{padding:24px 20px}#tv-settings .fields{grid-template-columns:1fr}#tv-settings .row{gap:12px;flex-wrap:wrap}#tv-settings .context select{max-width:170px}#tv-settings[data-mobile-page=true] aside{display:none}#tv-settings[data-mobile-page=false] main{display:none}#tv-settings .mobile-back{display:block;margin-bottom:24px}#tv-settings .toggle-end{margin-left:auto}}
</style>
<header><div class="brand">tallyvane<span> /</span></div><div class="context"><select id="tv-context" aria-label="Приложение"><option value="user">Личный аккаунт</option><option value="admin">Admin-консоль</option></select><div class="avatar">АК</div></div></header>
<div class="layout"><aside><div class="eyebrow">Настройки</div><nav aria-label="Разделы настроек" id="tv-nav"></nav></aside><main id="tv-main"></main></div>
<div class="demo">Интерактивный прототип · Данные демонстрационные, изменения не отправляются на сервер</div>
<dialog id="tv-guard" aria-labelledby="tv-guard-title"><h2 id="tv-guard-title">Уйти без сохранения?</h2><p>Внесённые изменения будут потеряны.</p><div class="footer"><button class="action primary" id="tv-stay">Остаться</button><button class="action" id="tv-leave">Уйти без сохранения</button></div></dialog>
<dialog id="tv-flow" aria-labelledby="tv-flow-title"></dialog>
<script>
(()=>{
const root=document.getElementById('tv-settings'),main=root.querySelector('#tv-main'),nav=root.querySelector('#tv-nav'),context=root.querySelector('#tv-context'),guard=root.querySelector('#tv-guard'),flow=root.querySelector('#tv-flow');
let app='user',section='profile',dirty=false,pending=null,mobile=false,flowStep=0,mfa=false,busy=false;
let profile={name:'Алексей Ковалёв',role:'Product designer'},org={name:'Tallyvane',role:'support@tallyvane.example'},toggles={digest:true,reminders:false,alerts:true,audit:true};
const sections={user:[['profile','user-round','Профиль'],['notifications','bell','Уведомления'],['security','shield-check','Безопасность']],admin:[['general','building-2','Организация'],['policy','shield-check','Аутентификация'],['events','activity','События и аудит']]};
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{application:app,section},privateContent:{app,section,toggles,mfa,mobile}}).catch(()=>{});}
function restore(s){const p=s?.privateContent;if(!p||!sections[p.app])return;app=p.app;section=sections[app].some(x=>x[0]===p.section)?p.section:sections[app][0][0];if(p.toggles)for(const k of Object.keys(toggles))if(typeof p.toggles[k]==='boolean')toggles[k]=p.toggles[k];mfa=!!p.mfa;mobile=!!p.mobile;}
function request(fn){if(busy)return;if(dirty){pending=fn;guard.showModal();root.querySelector('#tv-stay').focus();}else fn();}
function go(id){request(()=>{dirty=false;section=id;mobile=true;render();persist();});}
function heading(title,description){return `<button class="action mobile-back" id="tv-back">← Все настройки</button><div class="intro"><h1>${title}</h1><p>${description}</p></div>`;}
function toggle(key,title,description){return `<div class="row"><div><strong id="label-${key}">${title}</strong><p>${description}</p></div><div class="toggle-end"><span class="micro" id="state-${key}" aria-live="polite"></span><input class="switch" type="checkbox" role="switch" aria-labelledby="label-${key}" data-toggle="${key}" ${toggles[key]?'checked':''}></div></div>`;}
function render(){context.value=app;root.dataset.mobilePage=String(mobile);nav.innerHTML=sections[app].map(([id,icon,title])=>`<button data-section="${id}" class="${section===id?'active':''}" ${section===id?'aria-current="page"':''}><i data-lucide="${icon}" aria-hidden="true"></i>${title}</button>`).join('');
if(section==='profile'||section==='general'){const personal=section==='profile',data=personal?profile:org;main.innerHTML=heading(personal?'Профиль':'Организация',personal?'Ваше имя и информация о вас.':'Основная информация рабочего пространства.')+`<h2>${personal?'Личные данные':'Данные организации'}</h2><p>${personal?'Так вас будут видеть в Tallyvane.':'Контактные данные для участников пространства.'}</p><form id="tv-form"><div class="fields"><label>${personal?'Имя и фамилия':'Название'}<input name="name" required maxlength="80" value="${escape(data.name)}"></label><label>${personal?'Профессиональная роль':'Контактный email'}<input name="role" ${personal?'':'type="email" required'} maxlength="120" value="${escape(data.role)}"></label></div><div class="footer"><span class="status" id="tv-save-state" aria-live="polite">Все изменения сохранены</span><button class="action" type="button" id="tv-reset" disabled>Отменить</button><button class="action primary" id="tv-save" disabled>Сохранить</button></div></form>`;const form=root.querySelector('#tv-form');form.oninput=()=>{dirty=form.elements.name.value!==data.name||form.elements.role.value!==data.role;root.querySelector('#tv-save').disabled=!dirty;root.querySelector('#tv-reset').disabled=!dirty;root.querySelector('#tv-save-state').textContent=dirty?'Есть несохранённые изменения':'Все изменения сохранены';};root.querySelector('#tv-reset').onclick=()=>{dirty=false;render();};form.onsubmit=e=>{e.preventDefault();if(!form.reportValidity())return;busy=true;form.querySelectorAll('input,button').forEach(x=>x.disabled=true);root.querySelector('#tv-save-state').textContent='Сохраняем…';setTimeout(()=>{data.name=form.elements.name.value;data.role=form.elements.role.value;dirty=false;busy=false;render();persist();},650);};}
if(section==='notifications')main.innerHTML=heading('Уведомления','Только то, что помогает двигаться дальше.')+`<h2>Ваш поиск работы</h2>`+toggle('digest','Еженедельный обзор','Итоги недели и ближайшие шаги — в одном письме.')+toggle('reminders','Напоминания о задачах','Напомним о запланированных встречах и follow-up.')+`<div class="group"><h2>Аккаунт</h2>`+toggle('alerts','Новые входы','Сообщать о входе с нового устройства.')+'</div>';
if(section==='security')main.innerHTML=heading('Безопасность','Управляйте входом и защитой аккаунта.')+`<h2>Способы входа</h2><div class="row"><div><strong>Пароль</strong><p>Установлен · изменён 12 сентября</p></div><button class="action" data-flow="password">Изменить</button></div><div class="group"><h2>Дополнительная защита</h2><div class="row"><div><strong>Приложение-аутентификатор</strong><p>Дополнительный код при входе в аккаунт.</p><span class="badge">${mfa?'Подключено':'Не подключено'}</span></div><button class="action ${mfa?'':'primary'}" data-flow="mfa">${mfa?'Посмотреть':'Настроить'}</button></div></div><div class="notice">Способы подтверждения определяются политикой безопасности аккаунта.</div>`;
if(section==='policy')main.innerHTML=heading('Аутентификация','Правила входа в рабочее пространство.')+`<h2>Политика безопасности</h2><div class="row"><div><strong>Двухфакторная аутентификация</strong><p>Требуется для администраторов.</p><span class="badge">Действующая политика</span></div><button class="action" data-flow="policy">Посмотреть</button></div><div class="notice">Изменения политики — отдельный управляемый сценарий.</div>`;
if(section==='events')main.innerHTML=heading('События и аудит','Контроль действий в рабочем пространстве.')+`<h2>Уведомления администратора</h2>`+toggle('audit','Отчёт об административных действиях','Еженедельное письмо с обзором изменений.');
nav.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.section));root.querySelector('#tv-back').onclick=()=>request(()=>{dirty=false;mobile=false;render();persist();});main.querySelectorAll('[data-toggle]').forEach(el=>el.onchange=()=>{const key=el.dataset.toggle,value=el.checked,status=root.querySelector('#state-'+key);el.disabled=true;status.textContent='Сохраняем…';setTimeout(()=>{toggles[key]=value;el.disabled=false;status.textContent='Сохранено';persist();},600);});main.querySelectorAll('[data-flow]').forEach(b=>b.onclick=()=>openFlow(b.dataset.flow));if(globalThis.lucide)lucide.createIcons();}
let flowType='mfa';
function openFlow(type){flowType=type;flowStep=0;drawFlow();flow.showModal();}
function closeFlow(){if(flowStep>0&&flowStep<3){pending=()=>{flow.close();flowStep=0;};guard.showModal();}else flow.close();}
function drawFlow(){if(flowType==='policy'||(flowType==='mfa'&&mfa)){flow.innerHTML=`<h2 id="tv-flow-title">${flowType==='policy'?'Политика аутентификации':'Защита подключена'}</h2><p>${flowType==='policy'?'Для администраторов требуется второй фактор. Конкретные правила и редактор политики проектируются отдельно.':'Приложение-аутентификатор подключено в демонстрационном сценарии.'}</p><div class="footer"><button class="action primary" id="tv-close">Готово</button></div>`;root.querySelector('#tv-close').onclick=()=>flow.close();return;}
if(flowType==='password'){flow.innerHTML=`<h2 id="tv-flow-title">Смена пароля</h2><p>Самостоятельный сценарий подтверждения личности и установки нового пароля.</p><div class="notice">В этом прототипе пошаговое взаимодействие показано на настройке аутентификатора.</div><div class="footer"><button class="action" id="tv-close">Закрыть</button></div>`;root.querySelector('#tv-close').onclick=()=>flow.close();return;}
const titles=['Настроить защиту','Подключить приложение','Проверить подключение','Всё готово'];const copy=['Покажем пример подключения приложения-аутентификатора.','В рабочем приложении здесь появятся QR-код и ключ подключения.','Введите демонстрационный код 123456.','Приложение-аутентификатор подключено.'];flow.innerHTML=`<div class="step">${flowStep<3?'Настройка защиты · '+(flowStep+1)+' из 3':'Настройка завершена'}</div><h2 id="tv-flow-title">${titles[flowStep]}</h2><p>${copy[flowStep]}</p>${flowStep===0?'<div class="notice">Демонстрационный сценарий. Реальная проверка личности и правила MFA остаются в модуле безопасности.</div>':''}${flowStep===1?'<div class="notice">Демо-подключение · секретные данные не создаются</div>':''}${flowStep===2?'<label style="margin-top:20px">Код подтверждения<input id="tv-code" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="123456"></label><div class="error" id="tv-code-error" role="alert"></div>':''}<div class="footer"><button class="action" id="tv-flow-cancel">${flowStep===3?'Закрыть':'Отменить'}</button>${flowStep<3?'<button class="action primary" id="tv-next">'+['Начать','Далее','Подтвердить'][flowStep]+'</button>':''}</div>`;root.querySelector('#tv-flow-cancel').onclick=closeFlow;const next=root.querySelector('#tv-next');if(next)next.onclick=()=>{if(flowStep===2&&root.querySelector('#tv-code').value!=='123456'){root.querySelector('#tv-code-error').textContent='Введите демо-код 123456.';return;}flowStep++;if(flowStep===3){mfa=true;render();persist();}drawFlow();};}
context.onchange=()=>{const next=context.value;context.value=app;request(()=>{dirty=false;app=next;section=sections[app][0][0];render();persist();});};root.querySelector('#tv-stay').onclick=()=>{guard.close();pending=null;};root.querySelector('#tv-leave').onclick=()=>{guard.close();dirty=false;const fn=pending;pending=null;if(fn)fn();};guard.oncancel=()=>{pending=null;};flow.oncancel=e=>{e.preventDefault();closeFlow();};window.addEventListener('beforeunload',e=>{if(dirty||(flow.open&&flowStep>0&&flowStep<3)){e.preventDefault();e.returnValue='';}});restore(window.openai?.widgetState);render();window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState&&!dirty&&!flow.open&&!busy){restore(e.detail.globals.widgetState);render();}});
if(globalThis.Tweak){const design={compact:false};const tweak=new Tweak({container:root,onChange:()=>{root.dataset.compact=String(design.compact);}});tweak.addToggle(design,'compact',{label:'Компактные строки'});}
})();
</script>
</div>
