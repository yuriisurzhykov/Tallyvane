<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Правила подтверждения — прототип</title><style>html{color-scheme:light dark}body{margin:0;padding:16px;font-family:system-ui;background:light-dark(#e9eef1,#0e1921)}</style></head><body>
<div id="policy-walkthrough">
<style>
#policy-walkthrough{font:14px/1.5 'IBM Plex Sans',system-ui,sans-serif;color:light-dark(#15232d,#ebf1f4);background:light-dark(#f5f7f8,#14212b);padding:20px;border-radius:12px}#policy-walkthrough *{box-sizing:border-box}#policy-walkthrough h2{font-size:22px;margin:0}#policy-walkthrough h3{font-size:17px;margin:0 0 8px}#policy-walkthrough p{margin:4px 0 12px}#policy-walkthrough .pw-muted{color:light-dark(#536674,#b6c5d0)}#policy-walkthrough .pw-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}#policy-walkthrough .pw-layout{display:grid;grid-template-columns:minmax(250px,.8fr) minmax(0,1.2fr);gap:14px;margin-top:14px}#policy-walkthrough .pw-panel{background:light-dark(#fff,#20323e);border:1px solid light-dark(#d5e0e5,#435563);border-radius:10px;padding:18px}#policy-walkthrough .pw-item{border-top:1px solid light-dark(#e0e8ec,#40525f);padding:12px 0}#policy-walkthrough .pw-item:first-of-type{border-top:0}#policy-walkthrough button,#policy-walkthrough select,#policy-walkthrough input{font:inherit}#policy-walkthrough button{border:1px solid light-dark(#b9cbd4,#59707f);background:light-dark(#fff,#263b48);color:inherit;border-radius:7px;padding:8px 12px}#policy-walkthrough button.pw-primary{background:light-dark(#135d79,#83cde6);color:light-dark(#fff,#102b36);border-color:transparent}#policy-walkthrough button:disabled{opacity:.5}#policy-walkthrough select{width:100%;padding:9px;border-radius:7px;border:1px solid light-dark(#aebfc9,#697b86);background:light-dark(#fff,#172833);color:inherit}#policy-walkthrough label{display:block;margin:8px 0}#policy-walkthrough .pw-choice{display:block;border:1px solid light-dark(#d6e1e6,#4d6370);border-radius:8px;padding:10px;margin:7px 0}#policy-walkthrough .pw-steps{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}#policy-walkthrough .pw-step{padding:4px 8px;border-radius:6px;background:light-dark(#e8eef1,#2c4350)}#policy-walkthrough .pw-current{background:light-dark(#cceaf4,#42687a);font-weight:700}#policy-walkthrough .pw-example{border-left:3px solid light-dark(#147397,#83cde6);padding:6px 0 6px 12px;margin:14px 0}#policy-walkthrough .pw-error{color:light-dark(#a42a39,#ffacb3);font-weight:700}#policy-walkthrough .pw-footer{margin-top:14px}#policy-walkthrough .pw-rank{display:flex;gap:8px;flex-wrap:wrap}#policy-walkthrough .pw-rank button[aria-pressed=true]{background:light-dark(#cceaf4,#42687a);font-weight:700}@media(max-width:680px){#policy-walkthrough .pw-layout{grid-template-columns:1fr}#policy-walkthrough{padding:12px}}
</style>
<div class="pw-row"><div><h2>Правила подтверждения</h2><p class="pw-muted">Одна схема = один путь, которым пользователь подтверждает действие.</p></div><span>Прототип · версия 8</span></div>
<div class="pw-steps"><span class="pw-step pw-current">1 · Действие</span><span class="pw-step">2 · Способы</span><span class="pw-step">3 · Приоритет</span><span class="pw-step">4 · Проверка</span></div>
<div class="pw-layout"><section class="pw-panel"><h3>Для какого действия?</h3><select id="pw-action" aria-label="Действие"><option value="SIGN_IN">Вход в аккаунт</option><option value="MANAGE_SECOND_FACTORS">Управление факторами</option><option value="CHANGE_PRIMARY_CREDENTIAL">Смена способа входа</option></select><div id="pw-list"></div><button id="pw-add" class="pw-primary" type="button">+ Добавить допустимый путь</button></section><section class="pw-panel" id="pw-work"></section></div>
<div class="pw-panel pw-footer pw-row"><div id="pw-status" aria-live="polite"></div><button id="pw-save" class="pw-primary" type="button">Сохранить политику</button></div>
</div>
<script>
(()=>{const r=document.getElementById('policy-walkthrough');const actions={SIGN_IN:'входа',MANAGE_SECOND_FACTORS:'управления факторами',CHANGE_PRIMARY_CREDENTIAL:'смены способа входа'};const labels={PASSWORD:'Пароль',GOOGLE:'Google',EMAIL_SIGN_IN_CODE:'Код входа по email',TOTP:'Код приложения',EMAIL_FACTOR_CODE:'Код email как второй фактор'};const primary=['PASSWORD','GOOGLE','EMAIL_SIGN_IN_CODE'];const factors=['TOTP','EMAIL_FACTOR_CODE'];const data=[{id:1,action:'SIGN_IN',p:'PASSWORD',f:'',rank:1},{id:2,action:'SIGN_IN',p:'PASSWORD',f:'TOTP',rank:2},{id:3,action:'SIGN_IN',p:'EMAIL_SIGN_IN_CODE',f:'',rank:1},{id:4,action:'MANAGE_SECOND_FACTORS',p:'EMAIL_SIGN_IN_CODE',f:'',rank:1},{id:5,action:'MANAGE_SECOND_FACTORS',p:'PASSWORD',f:'TOTP',rank:2},{id:6,action:'CHANGE_PRIMARY_CREDENTIAL',p:'PASSWORD',f:'',rank:1}];const s={action:'SIGN_IN',selected:null,step:1,notice:''};const list=()=>data.filter(x=>x.action===s.action);const current=()=>data.find(x=>x.id===s.selected);const title=x=>x?`${labels[x.p]||'Выберите основной способ'}${x.f?' + '+labels[x.f]:''}`:'';function valid(){if(data.some(x=>!x.p))return 'Завершите настройку всех добавленных путей.';return ''}function draw(){r.querySelector('#pw-action').value=s.action;r.querySelectorAll('.pw-step').forEach((e,i)=>e.classList.toggle('pw-current',i===s.step-1));r.querySelector('#pw-list').innerHTML=list().map(x=>`<div class="pw-item pw-row"><div><strong>${title(x)}</strong><div class="pw-muted">Уровень ${x.rank}</div></div><button type="button" data-open="${x.id}">${s.selected===x.id?'Открыта':'Изменить'}</button></div>`).join('')||'<p class="pw-muted">Путей пока нет.</p>';const x=current();let html;if(!x){html='<h3>Добавьте путь</h3><p>Каждый путь отвечает на вопрос: «Чем пользователь может подтвердить это действие?»</p><div class="pw-example">Пример: «Пароль + код приложения» — оба подтверждения нужны вместе. Другой путь, например «Google», добавляется отдельно.</div>'}else if(s.step===2){html=`<h3>Шаг 2. Какие подтверждения нужны?</h3><p>Сначала выберите способ, с которого пользователь начинает. Затем при необходимости добавьте второе подтверждение.</p><strong>Основной способ · выберите один</strong>${primary.map(k=>`<label class="pw-choice"><input type="radio" name="pw-primary" value="${k}" ${x.p===k?'checked':''}> ${labels[k]}</label>`).join('')}<strong>Дополнительное подтверждение · необязательно</strong><label class="pw-choice"><input type="radio" name="pw-factor" value="" ${!x.f?'checked':''}> Не требуется</label>${factors.map(k=>`<label class="pw-choice"><input type="radio" name="pw-factor" value="${k}" ${x.f===k?'checked':''}> ${labels[k]}</label>`).join('')}<div class="pw-example">Получится: <strong>${title(x)}</strong>. Это один путь; пользователь должен пройти обе части, если они выбраны.</div><button class="pw-primary" type="button" data-next="3" ${x.p?'':'disabled'}>Далее: приоритет</button>`}else if(s.step===3){html=`<h3>Шаг 3. Когда выбирать этот путь?</h3><p>Если у пользователя доступны несколько путей, система рекомендует самый высокий доступный уровень. Остальные разрешённые пути остаются доступными.</p><div class="pw-rank">${[1,2,3].map(n=>`<button type="button" data-rank="${n}" aria-pressed="${x.rank===n}">Уровень ${n}</button>`).join('')}</div><div class="pw-example">${title(x)} · уровень ${x.rank}</div><div class="pw-row"><button type="button" data-next="2">Назад</button><button class="pw-primary" type="button" data-next="4">Далее: проверка</button></div>`}else{const stronger=list().filter(y=>y.id!==x.id&&y.rank>x.rank);html=`<h3>Шаг 4. Проверьте правило</h3><p><strong>Для ${actions[s.action]}:</strong> ${title(x)} · уровень ${x.rank}.</p><div class="pw-example">Если у человека есть ${title(x).toLowerCase()}, этот путь доступен. ${stronger.length?'Если ему также доступен путь с более высоким уровнем, система порекомендует его.':'Если доступных путей сильнее нет, этот путь будет рекомендуемым.'}</div><div class="pw-row"><button type="button" data-next="2">Изменить</button><button type="button" data-delete="${x.id}">Удалить путь</button><button class="pw-primary" type="button" data-done="1">Готово</button></div>`}r.querySelector('#pw-work').innerHTML=html;const error=valid();r.querySelector('#pw-status').innerHTML=error?`<span class="pw-error">${error}</span>`:s.notice||'Другие пути добавляются той же кнопкой слева.';r.querySelector('#pw-save').disabled=!!error}r.addEventListener('change',e=>{const el=e.target;if(el.id==='pw-action'){s.action=el.value;s.selected=null;s.step=1;s.notice=''}else{const x=current();if(!x)return;if(el.name==='pw-primary')x.p=el.value;if(el.name==='pw-factor')x.f=el.value}draw()});r.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='pw-add'){const id=Math.max(...data.map(x=>x.id))+1;data.push({id,action:s.action,p:'',f:'',rank:1});s.selected=id;s.step=2;s.notice=''}else if(b.dataset.open){s.selected=Number(b.dataset.open);s.step=2;s.notice=''}else if(b.dataset.next){s.step=Number(b.dataset.next)}else if(b.dataset.rank){current().rank=Number(b.dataset.rank)}else if(b.dataset.delete){const i=data.findIndex(x=>x.id===Number(b.dataset.delete));data.splice(i,1);s.selected=null;s.step=1}else if(b.dataset.done){s.selected=null;s.step=1;s.notice='Путь добавлен. Можно добавить ещё один для того же действия.'}else if(b.id==='pw-save'){s.notice='В прототипе политика сохранена локально.'}draw()});draw()})();
</script>

</body></html>
