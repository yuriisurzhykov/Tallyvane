# The API contract, and the source of truth for it (§11.7).
#
# Types for the frontend and for the extension are generated from this file, and CI checks
# backward compatibility against it. So an endpoint is described here first and implemented
# second — not the other way round.
#
# 2026-08-26: the health endpoints and the error shape below were written *after* the code, in
# slices 11 and 12, and that was the wrong order. §11.7 had said this file is the source of
# truth since before either slice; the plan put it in slice 14, and nobody noticed the
# contradiction until the shapes were already fixed in Kotlin. Recorded rather than quietly
# corrected, because the ordering is the part that matters: from here on the entry precedes the
# endpoint, and `openapi-covers-routes` fails the build on an endpoint this file does not know.
#
# Only what exists is described. Endpoints of unbuilt modules would be a description of wishes.

openapi: 3.1.0

info:
  title: Tallyvane API
  version: 1.0.0
  description: |
    Personal job-search console. One user, one deployment.

    Conventions that hold everywhere (§11.1): JSON with `snake_case` fields, times in ISO 8601
    with an offset, money as integer cents in a field suffixed `_cents`, cursor pagination with
    `next_cursor`, `PATCH` with merge semantics where an absent field is untouched and an
    explicit `null` clears.

    Every `POST`, `PUT`, `PATCH` and `DELETE` carries `Idempotency-Key: <uuid>`, generated once
    for one intention and sent again, unchanged, if the request is repeated (ADR-086). Without it
    the answer is `400`. A repeat of a request that was carried out gets its first answer again,
    marked `Idempotent-Replayed: true`; the same key with a different request is `422`; a repeat
    that arrives while the first is still running is answered once the first finishes, or `409` with
    `Retry-After` if it takes longer than a few seconds, and a `409` without `Retry-After` means the
    work was carried out and its answer cannot be given again, so read the current state instead.

    Every endpoint is closed to anyone who is not signed in, unless its `security` lists `{}`, which
    means no credential is needed (ADR-088). A request that has no session is answered `401` with the problem `sign-in-required`; one
    whose session has ended, `401` with `session-expired`, and the client signs in again over the page it
    is on (ADR-084). Every `POST`, `PUT`, `PATCH` and `DELETE` must also come from the application's own
    origin: an `Origin` header that is not exactly it, or no `Origin` and no `Sec-Fetch-Site: same-origin`,
    is `403`, and a body that is not JSON is `415` (ADR-080).

servers:
  - url: /api/v1
    description: The only prefix. A module never writes it itself.

tags:
  - name: health
    description: Probes an orchestrator and a human read for different reasons.
  - name: authentication
    description: |
      Signing in with Google, and registering as a new person. Nothing here grants access: a completed
      sign-in is redeemed for a session in the next step (ADR-076).
  - name: sessions
    description: |
      What a person is given once they have signed in: a session, held by the browser as a cookie
      (ADR-079, ADR-080).
  - name: identity
    description: Who the signed-in person is.

paths:
  /health:
    get:
      tags: [health]
      operationId: healthAggregate
      summary: Aggregate health, for a human or an alert
      description: |
        Always answers 200: it is informational, and a 503 here would look to a monitor like the
        endpoint itself being down. The meaning is in the body.

        Without the service token the body is `HealthSummary` — one field. With it, `HealthDetail`
        adds `ready` and the per-check breakdown. Dependency names describe what the system is
        built from, which is why an anonymous caller does not get them (ADR-055).
      security:
        - {}
        - serviceToken: []
      responses:
        "200":
          description: The aggregate. Shape depends on whether the service token was accepted.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            traceparent:
              $ref: "#/components/headers/Traceparent"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/HealthSummary"
                  - $ref: "#/components/schemas/HealthDetail"
        default:
          $ref: "#/components/responses/Problem"

  /health/live:
    get:
      tags: [health]
      operationId: healthLive
      summary: Is the process alive
      description: |
        Consults no dependency, by construction — the handler is not given the reporter. A liveness
        probe that checked a dependency would turn that dependency's outage into a restart loop of
        a healthy process.

        Answers 200 with `{"status":"up"}` whenever it answers at all. A dead process does not
        answer, which is the signal.
      security:
        - {}
      responses:
        "200":
          description: The process is answering.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            traceparent:
              $ref: "#/components/headers/Traceparent"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSummary"
        default:
          $ref: "#/components/responses/Problem"

  /health/ready:
    get:
      tags: [health]
      operationId: healthReady
      summary: Should traffic come here
      description: |
        Readiness follows `required_for_readiness` on each check rather than the aggregate status,
        so a `degraded` application answers **200**: an unavailable optional dependency must not
        close the part of the product that does not need it.

        503 rather than 500 when unready — "not now, try later" is the statement being made.
      security:
        - {}
      responses:
        "200":
          description: Ready for traffic. May still be `degraded`.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            traceparent:
              $ref: "#/components/headers/Traceparent"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSummary"
        "503":
          description: A dependency required for readiness is down.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            traceparent:
              $ref: "#/components/headers/Traceparent"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSummary"
        default:
          $ref: "#/components/responses/Problem"

  /google-sign-in:
    post:
      tags: [authentication]
      operationId: signInWithGoogle
      summary: Start signing in with Google
      description: |
        Begins an attempt and answers where to send the browser. The attempt's secret travels in the
        `__Host-attempt` cookie set on this response: `HttpOnly`, `Secure`, `Path=/`, `SameSite=Lax`.
        Every sign-in starts as a login; a person Google turns out not to know is moved to a
        registration when they come back.

        A response that sets a cookie is never stored for a repeat of its `Idempotency-Key`; a repeat
        is answered `409` without `Retry-After`.
      security:
        - {}
      responses:
        "200":
          description: Where to send the browser.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/AttemptCookie"
            traceparent:
              $ref: "#/components/headers/Traceparent"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInStarted"
        default:
          $ref: "#/components/responses/Problem"

  /google-step-up:
    post:
      tags: [authentication]
      operationId: stepUpWithGoogle
      summary: Start confirming a dangerous act with Google
      description: |
        Begins a confirmation and answers where to send the browser, exactly as `POST /google-sign-in`
        does, with the attempt's secret in the same `__Host-attempt` cookie. It is public because it only
        begins an attempt, which proves nothing by itself. It counts only when a signed-in person takes it
        with `POST /step-ups`.

        When Google sends the browser back the redirect goes to `/step-up/continue`, never to the
        pages of a sign-in, and a Google account this application does not know is turned back instead
        of becoming a registration.

        A response that sets a cookie is never stored for a repeat of its `Idempotency-Key`; a repeat
        is answered `409` without `Retry-After`.
      security:
        - {}
      responses:
        "200":
          description: Where to send the browser.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/AttemptCookie"
            traceparent:
              $ref: "#/components/headers/Traceparent"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInStarted"
        default:
          $ref: "#/components/responses/Problem"

  /google-return:
    get:
      tags: [authentication]
      operationId: signInReturnFromGoogle
      summary: Where Google sends the browser back to
      description: |
        The one address registered with Google as the redirect URI. Reached by a redirect, so it never
        answers with an error document: every outcome is a `302` to a page of the application, and
        nothing in the request chooses which.

        - a person with an account who was signing in: `/login/continue`
        - a person confirming a dangerous act (`POST /google-step-up`): `/step-up/continue`
        - a new person: `/welcome`, with a new `__Host-attempt` cookie for their registration
        - anyone else: `/login?problem=<reason>`, the cookie cleared. Reasons: `restart`, `expired`,
          `cancelled`, `refused`, `email-unverified`, `unavailable`.
      security:
        - {}
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
          description: The authorization code. Absent when the person said no.
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: The `state` this sign-in sent to Google, which must match.
        - name: error
          in: query
          required: false
          schema:
            type: string
          description: Google's reason when it sent no code. Not read; its absence of a code is the signal.
      responses:
        "302":
          description: On to a page of the application.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              $ref: "#/components/headers/AttemptCookie"
            traceparent:
              $ref: "#/components/headers/Traceparent"

  /welcome:
    get:
      tags: [authentication]
      operationId: showWelcome
      summary: What the welcome form starts from
      description: |
        The name and address Google gave the person registering, to prefill the form. Never cached.
        `404` when the browser has no registration to finish: no cookie, one that expired, or one
        already used.
      security:
        - attemptCookie: []
      responses:
        "200":
          description: What Google said.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            traceparent:
              $ref: "#/components/headers/Traceparent"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Welcomed"
        default:
          $ref: "#/components/responses/Problem"

  /registration:
    post:
      tags: [authentication]
      operationId: register
      summary: Finish the welcome form
      description: |
        Creates the account of the person registering, with the name they chose, if they agreed to the
        privacy policy. Submitting twice finds the same account. Registering grants no access: the
        sign-in it completes waits to be redeemed for a session.

        `422` names the field: `agreed` (`consent-required`) or `name` (`name-invalid`). `404` when the
        browser has no registration to finish.
      security:
        - attemptCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Registering"
      responses:
        "204":
          description: The account exists.
          headers:
            traceparent:
              $ref: "#/components/headers/Traceparent"
        default:
          $ref: "#/components/responses/Problem"

  /sessions:
    post:
      tags: [sessions]
      operationId: openSession
      summary: Exchange a completed sign-in for a session
      description: |
        Public: the person asking is not signed in yet. What they hold instead is the cookie of a sign-in
        that is complete, and it is exchanged once. The answer sets `__Host-session` and takes
        `__Host-attempt` away.

        `404` when there is nothing complete to exchange: no cookie, one that expired, one already
        exchanged, or a sign-in that is not finished (a registration waiting for its form). A response
        that sets a cookie is never replayed for a repeated `Idempotency-Key`, so a repeat is told `409`
        without `Retry-After`: the work was carried out, so read the current state instead.
      security:
        - attemptCookie: []
      responses:
        "204":
          description: The session exists, and the browser holds it.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
            traceparent:
              $ref: "#/components/headers/Traceparent"
        default:
          $ref: "#/components/responses/Problem"

  /step-ups:
    post:
      tags: [sessions]
      operationId: confirmStepUp
      summary: Prove who you are again, for a dangerous act
      description: |
        For a signed-in person, including one whose last proof has gone stale: this is how they get a
        fresh one. Takes the finished confirmation named by the `__Host-attempt` cookie (see
        `POST /google-step-up`) and moves the time of the last proof on the session the browser presents.
        The session is the same one: its secret does not change and it does not live longer.

        - `401` no session, or one that has ended.
        - `403` the confirmation was another person's. It is spent all the same, and the session is
          unchanged. The page starts again.
        - `409` there is no finished confirmation to take: no cookie, one that expired, one already
          taken, or one still waiting for a code.

        A response that sets a cookie is never replayed for a repeated `Idempotency-Key`.
      security:
        - sessionCookie: []
          attemptCookie: []
      responses:
        "204":
          description: |
            The session counts the new proof. `__Host-attempt` is set with `Max-Age=0`, since the
            confirmation is spent.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/AttemptCookie"
            traceparent:
              $ref: "#/components/headers/Traceparent"
        default:
          $ref: "#/components/responses/Problem"

  /session:
    delete:
      tags: [sessions]
      operationId: signOut
      summary: Sign out
      description: |
        Public, so that a person whose session has already ended can still clear their cookie. Forgets the
        session the browser presents and tells the browser to forget its cookie. Always `204`: a session
        that was good, one that had ended and none at all all end the same way, with the person signed out.
      security:
        - {}
        - sessionCookie: []
      responses:
        "204":
          description: The person is signed out.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
            traceparent:
              $ref: "#/components/headers/Traceparent"
        default:
          $ref: "#/components/responses/Problem"

  /me:
    get:
      tags: [identity]
      operationId: whoAmI
      summary: Who the signed-in person is
      description: |
        Never cached. `401` `sign-in-required` when no session is presented; `401` `session-expired` when
        the session has ended or names an account that no longer exists.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The account and the name the person is called by.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            traceparent:
              $ref: "#/components/headers/Traceparent"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"

  /devices:
    get:
      tags: [sessions]
      operationId: listDevices
      summary: The devices the person is signed in on
      description: |
        The live sessions of the signed-in person, the most recently used first, the one asking marked
        `current`. A session past its lifetimes under the policy in force is not listed. Never cached.

        A browser says its kind and its system and no more, so two of a person's browsers on the same
        system look alike; `PUT /device-names/{id}` lets them tell the devices apart.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The devices.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            traceparent:
              $ref: "#/components/headers/Traceparent"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Devices"
        default:
          $ref: "#/components/responses/Problem"

  /device/{id}:
    delete:
      tags: [sessions]
      operationId: signOutOnDevice
      summary: Sign out on one device
      description: |
        Ends the session `id`, which `GET /devices` lists. It may be the one asking, which is then the same
        as signing out here. `404` when `id` is not a session of the signed-in person: one that never was,
        one that has ended, a stranger's and a value that is not an id all answer alike.

        A dangerous act: it asks for a recent proof of who the person is (ADR-092). A person whose last
        proof is older is answered `403` with the problem type `step-up-required`, and goes on after
        `POST /step-ups`.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The session has ended.
          headers:
            traceparent:
              $ref: "#/components/headers/Traceparent"
        default:
          $ref: "#/components/responses/Problem"

  /device-names/{id}:
    put:
      tags: [sessions]
      operationId: nameDevice
      summary: Give a device a name
      description: |
        Names the session `id` of the signed-in person. Naming twice leaves the last name. `422` names the
        field: `name` (`name-invalid`). `404` as for `DELETE /device/{id}`.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceNaming"
      responses:
        "204":
          description: The device has the name.
          headers:
            traceparent:
              $ref: "#/components/headers/Traceparent"
        default:
          $ref: "#/components/responses/Problem"

  /other-devices:
    delete:
      tags: [sessions]
      operationId: signOutOnOtherDevices
      summary: Sign out everywhere but here
      description: |
        Ends every session of the signed-in person except the one asking. `204` whether there was
        another session or not.

        A dangerous act: it asks for a recent proof of who the person is (ADR-092). A person whose last
        proof is older is answered `403` with the problem type `step-up-required`, and goes on after
        `POST /step-ups`.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Every other session has ended.
          headers:
            traceparent:
              $ref: "#/components/headers/Traceparent"
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    attemptCookie:
      type: apiKey
      in: cookie
      name: __Host-attempt
      description: |
        A random secret held by the browser for the sign-in in progress. The database keeps only a keyed
        digest of it. Not a credential to act as anyone: it continues one sign-in and nothing else.
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-session
      description: |
        A random secret held by the browser once the person has signed in. The database keeps only a keyed
        digest of it, so reading the table does not let anyone act as the person. A session ends after it has
        gone unused for the idle lifetime and after the absolute lifetime whatever its use, both set by the
        policy in force (a day and seven days to begin with), or when the person signs out.
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
      description: |
        A service secret from the deploy's configuration, not a user credential — which is why it
        is not `Authorization`. Temporary: it exists because §11.2's authentication arrives with
        the `identity` module, and it is replaced when that lands (ADR-063).

        A wrong or absent token is not an error. The caller gets the public answer, because
        refusing would tell an anonymous caller that there is something to refuse.

  headers:
    AttemptCookie:
      description: |
        `__Host-attempt=<secret>; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=900`, or the same with
        `Max-Age=0` to make the browser forget it. `__Host-` makes the browser refuse it unless it is
        `Secure`, has `Path=/` and names no `Domain`.
      schema:
        type: string
    SessionCookie:
      description: |
        `__Host-session=<secret>; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=7776000` when a session
        begins (the longest a session can be allowed to live, so a lifetime loosened later still reaches it),
        or the same with `Max-Age=0` to make the browser forget it. `__Host-` makes the browser refuse it
        unless it is `Secure`, has `Path=/` and names no `Domain`. A response that sets it also sets
        `__Host-attempt` with `Max-Age=0`.
      schema:
        type: string
    NoStore:
      description: |
        Always `no-store`. Cloudflare sits in front of this application, and a 200 with no cache
        directives is a legitimate thing to cache — after which a cheerful "up" would outlive the
        truth.
      schema:
        type: string
        const: no-store
    Traceparent:
      description: |
        W3C Trace Context. Present on every response, including ones with no body. Quote it when
        reporting a problem: the same id is on the log lines of that request.
      schema:
        type: string
        pattern: "^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$"

  responses:
    Problem:
      description: |
        Any failure, in one shape (§11.6, RFC 9457). A route never invents a status or a `type`:
        both come from a closed set in the platform, so a client can branch on `type` and expect
        it to stay put (ADR-062).

        This includes the statuses the server produces before any endpoint is reached — an unknown
        path, a method an endpoint does not accept. Those carry `about:blank` and no `detail`, and
        they are not listed per operation below, because they are not any one operation's answer.
      headers:
        traceparent:
          $ref: "#/components/headers/Traceparent"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    HealthStatus:
      type: string
      enum: [up, degraded, down]
      description: |
        Three states, not two. `degraded` means working with something missing — the distinction
        exists so that an unavailable optional dependency does not read as an outage.

    HealthSummary:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
      description: |
        What an unauthorised caller gets. One field, and a separate schema from `HealthDetail`
        rather than a filtered view of it: a shape with one field cannot leak a second.

    HealthDetail:
      type: object
      additionalProperties: false
      required: [status, ready, checks]
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        ready:
          type: boolean
          description: |
            Kept although it is derivable from the checks, because the derivation is not obvious —
            a `down` optional dependency leaves the application ready — and making a reader redo
            that logic invites getting it wrong.
        checks:
          type: array
          items:
            $ref: "#/components/schemas/HealthChecked"

    HealthChecked:
      type: object
      additionalProperties: false
      required: [name, status, took_ms]
      properties:
        name:
          type: string
          description: Stable across releases, because alert rules reference it.
          examples: [database, schema]
        status:
          $ref: "#/components/schemas/HealthStatus"
        took_ms:
          type: integer
          minimum: 0
          description: Whole milliseconds, so an alert threshold reads `3` rather than `0.003`.
        cause:
          $ref: "#/components/schemas/HealthCause"

    HealthCause:
      description: |
        Why a check is not `up`, discriminated by `kind` — not `type`, because `threw` already has
        a field of that name and §11.6 spends `type` on a problem URI.

        Two internal causes have no representation here at all: an aggregate over ailing
        dependencies, and a schema behind the code. Both name what the system is made of, and
        ADR-055 withholds that from every answer including an authorised one.
      oneOf:
        - $ref: "#/components/schemas/CauseRefused"
        - $ref: "#/components/schemas/CauseOverran"
        - $ref: "#/components/schemas/CauseThrew"
      discriminator:
        propertyName: kind
        mapping:
          refused: "#/components/schemas/CauseRefused"
          overran: "#/components/schemas/CauseOverran"
          threw: "#/components/schemas/CauseThrew"

    CauseRefused:
      type: object
      additionalProperties: false
      required: [kind, says]
      properties:
        kind:
          type: string
          const: refused
        says:
          type: string
          description: The check's own words. The one cause whose text we write rather than a library.

    CauseOverran:
      type: object
      additionalProperties: false
      required: [kind, bound_ms]
      properties:
        kind:
          type: string
          const: overran
        bound_ms:
          type: integer
          minimum: 0
          description: The bound the check did not answer inside.

    CauseThrew:
      type: object
      additionalProperties: false
      required: [kind, type]
      properties:
        kind:
          type: string
          const: threw
        type:
          type: string
          description: |
            The exception's type and nothing else. A message carries hosts, ports and occasionally
            credentials (§17), so there is no field for one.
          examples: [SQLException]

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: |
            Stable identifier of the *kind* of failure, and the field a client branches on. It
            survives rewording of `title` and `detail`.

            `about:blank` means what RFC 9457 section 4.2.1 says it means: the failure has no
            semantics beyond its status code, and `title` is that code's own phrase. It is what a
            status the server produced without reaching any endpoint carries — an unknown path, a
            method an endpoint does not accept. A client telling "no such resource" apart from "no
            such address" branches on this field, which is the reason it is not one value for both.
          examples:
            - https://tallyvane.com/errors/validation-failed
            - https://tallyvane.com/errors/malformed-request
            - https://tallyvane.com/errors/internal
            - about:blank
        title:
          type: string
          description: The kind in human words, identical for every occurrence of one `type`.
        status:
          type: integer
          description: Repeated in the body so the document stands alone when forwarded or logged.
        detail:
          type: string
          description: This occurrence in human words. Never a driver's message.
        errors:
          type: array
          description: Per-field detail for a validation failure; absent otherwise.
          items:
            $ref: "#/components/schemas/FieldError"
        trace_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
          description: |
            Added by the renderer, so it is on every problem body including a 500. The same id is
            in the `traceparent` header and on the log lines of that request.

    FieldError:
      type: object
      additionalProperties: false
      required: [field, code]
      properties:
        field:
          type: string
          description: The name as the client sent it — `salary_min_cents`, not `salaryMinCents`.
        code:
          type: string
          description: |
            What is wrong, in a form a frontend can branch on. A free string on purpose: closing
            this set would put every module's validation vocabulary in the platform.
          examples: [range.invalid, required]

    SignInStarted:
      type: object
      additionalProperties: false
      required: [authorization_url]
      properties:
        authorization_url:
          type: string
          format: uri
          description: Google's sign-in page, with this attempt's `state`, `nonce` and PKCE challenge.

    Welcomed:
      type: object
      additionalProperties: false
      required: [name, email]
      properties:
        name:
          type: string
          description: The name Google has for the person, to be edited.
        email:
          type: string
          description: "The address Google verified. Shown, not editable, because it is the one that was verified."

    Me:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
          description: The account.
        name:
          type: string
          description: The name the person is called by.

    Registering:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: The name the person chose. 1 to 80 characters, no control characters.
        agreed:
          type: boolean
          default: false
          description: Whether the person agreed to the privacy policy. Without it nothing is created.

    Devices:
      type: object
      additionalProperties: false
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/Device"

    Device:
      type: object
      additionalProperties: false
      required: [id, browser, platform, mobile, signed_in_at, last_active_at, current]
      properties:
        id:
          type: string
          format: uuid
          description: The session. Names it for `DELETE /device/{id}` and `PUT /device-names/{id}`; it is not a secret.
        browser:
          type: string
          enum: [chrome, edge, firefox, opera, safari, other]
          description: As far as the `User-Agent` of the request that began the session says.
        platform:
          type: string
          enum: [windows, macos, linux, android, ios, chromeos, other]
          description: The system, as far as the `User-Agent` says. Not the machine.
        mobile:
          type: boolean
          description: A phone or a tablet.
        name:
          type: string
          description: What the person called the device. Absent until they do.
        signed_in_at:
          type: string
          format: date-time
          description: When the person proved who they are.
        last_active_at:
          type: string
          format: date-time
          description: Kept to the minute.
        current:
          type: boolean
          description: Whether this is the session asking.

    DeviceNaming:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          description: 1 to 60 characters once trimmed, no control characters.
